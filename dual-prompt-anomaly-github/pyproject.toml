[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-prompt-anomaly"
version = "0.1.0"
description = "Reproducible Dual-Prompt few-shot anomaly detection on MVTec AD"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dual-Prompt contributors" }]
keywords = ["anomaly-detection", "mvtec", "clip", "prompt-learning", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "open-clip-torch>=2.30",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
dual-prompt = "dual_prompt.cli:main"

[project.urls]
Repository = "https://github.com/your-org/dual-prompt-anomaly"
Issues = "https://github.com/your-org/dual-prompt-anomaly/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

