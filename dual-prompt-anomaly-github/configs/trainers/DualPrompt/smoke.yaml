seed: 7
device: cpu
output_dir: outputs/smoke

data:
  root: data/tiny_mvtec
  category: bottle
  shots: 4
  image_size: 32
  num_workers: 0

model:
  backbone: toy
  pretrained: none
  prompt_mode: dual
  prompt_layers: [0, 1, 2]
  prompt_length: 2
  text_prompt_layers: [0, 1, 2]
  text_prompt_length: 2
  conditioner: linear

training:
  epochs: 1
  batch_size: 2
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0
  regularization: 0.0001

memory:
  max_size: 64
  sampling: random
  neighbors: 1
  chunk_size: 32

inference:
  layer_weights: [0.333333, 0.333334, 0.333333]
  semantic_weight: 0.5
  top_pixels: 10
  threshold: 0.5

